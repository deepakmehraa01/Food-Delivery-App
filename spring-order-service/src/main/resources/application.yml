server:
  port: 8084
spring:
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
services:
  product:
    url: http://localhost:8083
notifications:
  topic: ${ORDER_NOTIFICATION_TOPIC:orders.placed.v1}
spring.cloud.openfeign:
  client:
    config:
      productClient:
        connectTimeout: 2000
        readTimeout: 3000
        loggerLevel: basic
resilience4j:
  retry:
    instances:
      productRead:
        max-attempts: 3
        wait-duration: 500ms
        ignore-exceptions:
          - com.ecommerce.order.exception.ProductNotFoundException
  circuitbreaker:
    instances:
      productRead:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      productWrite:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
management:
  endpoints:
    web:
      exposure:
        include: health,info
