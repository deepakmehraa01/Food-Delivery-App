server.port=8080
spring.application.name=api-gateway

# Customer reads
spring.cloud.gateway.server.webmvc.routes[0].id=customer-query-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${CUSTOMER_QUERY_URL:http://localhost:8087}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/customers,/api/customers/**
spring.cloud.gateway.server.webmvc.routes[0].predicates[1]=Method=GET

# Customer writes
spring.cloud.gateway.server.webmvc.routes[1].id=customer-command-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${CUSTOMER_COMMAND_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/customers,/api/customers/**
spring.cloud.gateway.server.webmvc.routes[1].predicates[1]=Method=POST,PUT,DELETE


# Product and order APIs; internal inventory endpoints are never routed.
spring.cloud.gateway.server.webmvc.routes[2].id=product-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${PRODUCT_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products,/api/products/**
spring.cloud.gateway.server.webmvc.routes[2].predicates[1]=Method=GET,POST,PUT,DELETE
spring.cloud.gateway.server.webmvc.routes[3].id=order-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${ORDER_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders,/api/orders/**
spring.cloud.gateway.server.webmvc.routes[3].predicates[1]=Method=GET,POST,PATCH

# Blocking MVC HTTP client timeouts; never automatically retry writes.
spring.http.clients.connect-timeout=${GATEWAY_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${GATEWAY_READ_TIMEOUT:3s}
spring.http.clients.redirects=dont-follow
# Use client timeouts instead of running servlet requests on TimeLimiter worker threads.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled=false
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2

# JWTs must be signed with RS256 and contain issuer, audience, expiry, subject, and roles.
gateway.security.jwt.issuer=${JWT_ISSUER_URI:http://localhost:8081}
gateway.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:${gateway.security.jwt.issuer}/oauth2/jwks}
gateway.security.jwt.audience=${JWT_AUDIENCE:food-delivery-api}

# Token buckets are per authenticated subject, or socket IP for anonymous clients.
gateway.rate-limit.capacity=${GATEWAY_RATE_LIMIT:60}
gateway.rate-limit.registration-capacity=${GATEWAY_REGISTRATION_RATE_LIMIT:5}
gateway.rate-limit.period=1m
gateway.rate-limit.maximum-keys=100000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none

spring.cloud.gateway.server.webmvc.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.id=customerQuery
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.fallback-uri=forward:/gateway/fallback
spring.cloud.gateway.server.webmvc.routes[0].filters[0].args.status-codes=500,502,503,504

spring.cloud.gateway.server.webmvc.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.id=customerCommand
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.fallback-uri=forward:/gateway/fallback
spring.cloud.gateway.server.webmvc.routes[1].filters[0].args.status-codes=500,502,503,504

spring.cloud.gateway.server.webmvc.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.id=product
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.fallback-uri=forward:/gateway/fallback
spring.cloud.gateway.server.webmvc.routes[2].filters[0].args.status-codes=500,502,503,504

spring.cloud.gateway.server.webmvc.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.id=order
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.fallback-uri=forward:/gateway/fallback
spring.cloud.gateway.server.webmvc.routes[3].filters[0].args.status-codes=500,502,503,504
