spring.application.name=inventory-service

server.port=${INVENTORY_SERVER_PORT:8086}

spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventorydb}
spring.datasource.username=${INVENTORY_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${INVENTORY_DB_PASSWORD:${DB_PASSWORD:root}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
